<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VisionLink Mock - Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-box" id="login-form" data-testid="login-form">
    <h1>Vision<span style="color:#d4a900">Link</span> Mock</h1>
    <p style="text-align:center;color:#616e7c;font-size:13px">Practice site for test automation</p>
    <label for="username">Username</label>
    <input id="username" name="username" data-testid="username" autocomplete="off">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" data-testid="password" autocomplete="off">
    <button type="submit" data-testid="login-button">Sign In</button>
    <div id="login-error" class="error hidden" data-testid="login-error" role="alert"></div>
    <p style="font-size:12px;color:#9aa5b1;margin-top:16px">Demo login: demo.user / Password123!</p>
  </form>
</div>
<script src="js/app.js"></script>
<script>
  if (isLoggedIn()) { window.location.href = "dashboard.html"; }
  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value;
    const err = document.getElementById("login-error");
    if (u === DEMO_USER.username && p === DEMO_USER.password) {
      sessionStorage.setItem("vl_user", u);
      window.location.href = "dashboard.html";
    } else {
      err.textContent = "Invalid username or password";
      err.classList.remove("hidden");
    }
  });
</script>
</body>
</html>
