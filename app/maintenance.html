<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VisionLink Mock - Maintenance</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header"></div>
<main>
  <h1 data-testid="page-title">Maintenance</h1>
  <div class="panel">
    <div class="toolbar">
      <select id="m-status" data-testid="maint-status-filter">
        <option value="">All</option><option>Scheduled</option><option>Overdue</option>
      </select>
      <button id="delete-btn" data-testid="open-confirm" class="secondary">Delete first visible task</button>
    </div>
    <table data-testid="maint-table">
      <thead><tr><th>Task ID</th><th>Asset</th><th>Task</th><th>Due</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <h3>Embedded service manual (iframe)</h3>
    <iframe title="manual" name="manual" data-testid="manual-frame" src="manual.html" style="width:100%;height:120px;border:1px solid #cbd2d9"></iframe>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  requireLogin();
  renderHeader("Maintenance");
  let items = MockData.maintenance.slice();
  function render() {
    const st = document.getElementById("m-status").value;
    const list = items.filter(function (m) { return !st || m.status === st; });
    document.getElementById("rows").innerHTML = list.map(function (m) {
      return '<tr data-testid="maint-row" data-task-id="' + m.id + '"><td>' + m.id + "</td><td>" + m.assetId + "</td><td>" + m.task + "</td><td>" + m.due + "</td><td>" + badge(m.status) + "</td></tr>";
    }).join("");
  }
  document.getElementById("m-status").onchange = render;
  // native browser confirm() dialog - tests must handle page.on('dialog')
  document.getElementById("delete-btn").onclick = function () {
    const first = document.querySelector('[data-testid="maint-row"]');
    if (!first) return;
    if (confirm("Delete task " + first.getAttribute("data-task-id") + "?")) {
      items = items.filter(function (m) { return m.id !== first.getAttribute("data-task-id"); });
      render(); toast("Task deleted");
    }
  };
  render();
</script>
</body>
</html>
